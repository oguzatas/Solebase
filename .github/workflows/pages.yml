# Deploy Solebase static tree to GitHub Pages (free HTTPS host).
# Live URL: https://oguzatas.github.io/Solebase/
# Enable once: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          # Serve welcome + examples + packages/solebase/dist + core (no .git).
          mkdir -p _site
          tar -C . \
            --exclude='./.git' \
            --exclude='./_site' \
            --exclude='./node_modules' \
            -cf - . | tar -C _site -xf -
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Relative asset URLs work under /Solebase/ project Pages base.
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
