<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0e11" />
  <meta name="description" content="Solebase wiki — local-first pages on OPFS + cr-sqlite" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Solebase</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0e11;
      --bg-elevated: #161a20;
      --bg-sidebar: #111419;
      --border: #2a323d;
      --border-soft: color-mix(in oklab, #2a323d 70%, transparent);
      --text: #e6e9ee;
      --text-muted: #6b7380;
      --accent: #7a9e8a;
      --accent-2: #a3bfb0;
      --accent-ink: #0d1611;
      --danger: #c97a7a;
      --font-display: 'Bricolage Grotesque', ui-sans-serif, sans-serif;
      --font-body: 'Figtree', ui-sans-serif, sans-serif;
      --radius: 0.5rem;
      --sidebar-w: 3.25rem;
      --sidebar-w-open: 13.5rem;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background:
        radial-gradient(1100px 640px at 8% -8%, rgba(122, 158, 138, 0.06), transparent 55%),
        radial-gradient(900px 520px at 96% 4%, rgba(90, 110, 140, 0.07), transparent 52%),
        linear-gradient(168deg, #08090b 0%, #0c0e11 42%, #10141a 100%);
      background-attachment: fixed;
      overflow: hidden;
    }

    #app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      height: 100%;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
      padding: 0.75rem 0.45rem;
      background: color-mix(in oklab, var(--bg-sidebar) 92%, transparent);
      border-right: 1px solid var(--border-soft);
      backdrop-filter: blur(12px);
      transition: width 0.25s var(--ease-out);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.35rem 0.2rem 0.65rem;
    }

    .brand-glyph {
      width: 2rem;
      height: 2rem;
      border-radius: 0.45rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--accent-2);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .brand-text-wrap {
      display: none;
      text-align: left;
      min-width: 0;
    }

    body.sidebar-expanded #app {
      grid-template-columns: var(--sidebar-w-open) 1fr;
    }

    body.sidebar-expanded .brand-text-wrap { display: block; }
    body.sidebar-expanded #sidebar { padding: 0.85rem 0.65rem; }

    .brand-text {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .brand-tag {
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    .sidebar-foot {
      margin-top: auto;
      padding: 0.35rem 0.2rem;
    }

    #conn-status {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.3;
    }

    body.sidebar-expanded #conn-status { text-align: left; padding: 0 0.35rem; }

    #conn-status[data-ok="1"] { color: var(--accent-2); }

    .workspace {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border-soft);
      background: color-mix(in oklab, var(--bg) 70%, transparent);
      backdrop-filter: blur(10px);
      min-height: 3rem;
    }

    .topbar-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    #btn-menu,
    #btn-expand-sidebar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 0.4rem;
      padding: 0.35rem;
      cursor: pointer;
    }

    #btn-menu { display: none; }

    #main-pane {
      flex: 1;
      overflow: hidden;
      padding: 0;
    }

    .pane-enter {
      animation: pane-in 0.4s var(--ease-out) both;
    }

    @keyframes pane-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .boot-error {
      margin: 2rem;
      color: var(--danger);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 0.45rem;
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.15s, background 0.2s, border-color 0.2s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-2); }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.03);
      border-color: color-mix(in oklab, var(--accent) 35%, var(--border));
    }

    /* Wiki layout */
    .wiki {
      display: grid;
      grid-template-columns: minmax(12rem, 16rem) 1fr;
      height: 100%;
      min-height: 0;
    }

    .wiki-rail {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding: 1rem 0.85rem;
      border-right: 1px solid var(--border-soft);
      min-height: 0;
      overflow: hidden;
      background: color-mix(in oklab, var(--bg-sidebar) 55%, transparent);
    }

    .wiki-rail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .wiki-rail-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .wiki-list {
      list-style: none;
      margin: 0;
      padding: 0;
      overflow: auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .wiki-list-item {
      width: 100%;
      text-align: left;
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
      padding: 0.5rem 0.55rem;
      border-radius: 0.4rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wiki-list-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .wiki-list-item.is-active {
      background: color-mix(in oklab, var(--accent) 14%, transparent);
      border-color: color-mix(in oklab, var(--accent) 28%, var(--border));
      color: var(--accent-2);
    }

    .wiki-empty {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .wiki-editor {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100%;
      padding: 1rem 1.15rem 1.25rem;
      gap: 0.75rem;
    }

    .wiki-editor-toolbar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .wiki-title {
      flex: 1;
      min-width: 10rem;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      padding: 0.35rem 0;
      outline: none;
    }

    .wiki-title:focus {
      border-bottom-color: color-mix(in oklab, var(--accent) 50%, var(--border));
    }

    .wiki-title:disabled {
      opacity: 0.45;
    }

    .wiki-actions {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .wiki-body {
      flex: 1;
      min-height: 12rem;
      resize: none;
      width: 100%;
      background: color-mix(in oklab, var(--bg-elevated) 70%, transparent);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      line-height: 1.55;
      padding: 0.9rem 1rem;
      outline: none;
    }

    .wiki-body:focus {
      border-color: color-mix(in oklab, var(--accent) 40%, var(--border));
    }

    .wiki-body:disabled {
      opacity: 0.45;
    }

    .wiki-status {
      margin: 0;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    #toast {
      position: fixed;
      bottom: 1.35rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1rem;
      border-radius: 0.45rem;
      font-size: 0.85rem;
      z-index: 60;
      opacity: 0;
      transition: transform 0.3s var(--ease-out), opacity 0.3s;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
      max-width: min(90vw, 28rem);
      text-align: center;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #toast[data-type="err"] {
      border-color: color-mix(in oklab, var(--danger) 45%, var(--border));
      color: #f0c4c4;
    }

    @media (prefers-reduced-motion: reduce) {
      .pane-enter { animation: none !important; }
    }

    @media (max-width: 860px) {
      #app { grid-template-columns: 1fr !important; }

      #sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(var(--sidebar-w-open), 85vw);
        z-index: 30;
        transform: translateX(-105%);
        transition: transform 0.3s var(--ease-out);
        box-shadow: 12px 0 40px rgba(0, 0, 0, 0.4);
        padding: 0.85rem 0.65rem;
      }

      body.sidebar-open #sidebar { transform: none; }

      body.sidebar-open::after {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 25;
      }

      #btn-menu { display: inline-flex; }
      #btn-expand-sidebar { display: none; }
      .brand-text-wrap { display: block; }
      #conn-status { text-align: left; padding: 0 0.35rem; }

      .wiki {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(8rem, 32%) 1fr;
      }

      .wiki-rail {
        border-right: 0;
        border-bottom: 1px solid var(--border-soft);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Solebase">
      <div class="sidebar-brand" title="Solebase">
        <div class="brand-glyph" aria-hidden="true">S</div>
        <div class="brand-text-wrap">
          <div class="brand-text">Solebase</div>
          <div class="brand-tag">Local wiki</div>
        </div>
      </div>
      <div class="sidebar-foot">
        <div id="conn-status" data-ok="0">Starting…</div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button type="button" id="btn-menu" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button type="button" id="btn-expand-sidebar" aria-label="Expand sidebar" title="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
        </button>
        <span class="topbar-title" id="topbar-title">Wiki</span>
      </header>
      <main id="main-pane" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('SW registration failed', err);
        });
      });
    }
  </script>
</body>
</html>
